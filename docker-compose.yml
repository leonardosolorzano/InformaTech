services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: technews
      POSTGRES_PASSWORD: technews
      POSTGRES_DB: technews
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technews"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - informatech_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://technews:technews@db:5432/technews
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://web:3000", "http://localhost"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - informatech_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        API_INTERNAL_URL: http://api:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - informatech_network

volumes:
  pgdata:
  uploads:

networks:
  informatech_network:
    driver: bridge
