[project]
name = "informatech"
version = "0.1.0"
description = "InformaTech - Article management API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.49",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.9",
    "pillow>=12.2.0",
    "python-multipart>=0.0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
